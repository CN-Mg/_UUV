[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uuv-visual-simulation"
version = "0.2.0"
description = "DEMO_UNCALIBRATED 微型 UUV 参数级视觉定位仿真"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2,<3", "scipy>=1.14,<2", "PyYAML>=6,<7", "websockets>=13,<17"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
